version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.10
    working_directory: ~/repo

commands:
  install-deps:
    steps:
      - checkout
      - run:
          name: Instalar dependencias
          command: |
            pip install pytest flake8

jobs:
  test:
    executor: python-executor
    parallelism: 2  # Ejecutar pruebas en paralelo
    steps:
      - install-deps
      - run:
          name: Ejecutar pruebas en paralelo
          command: |
            pytest test_cliente.py

  lint:
    executor: python-executor
    steps:
      - install-deps
      - run:
          name: Revisar estilo de código con flake8
          command: |
            flake8 . > flake8-report.txt || true
      - store_artifacts:
          path: flake8-report.txt
          destination: flake8-report

  run-script:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Crear input.txt simulado
          command: |
            echo -e "1\n123\n4\n" > input.txt  # Simula: opción 1, ID 123, luego salir
      - run:
          name: Ejecutar main.py
          command: |
            python main.py < input.txt

workflows:
  version: 2
  build_and_test:
    jobs:
      - lint
      - test
      - run-script:
          requires:
            - test

notifications:
  webhooks:
    - url: https://hooks.slack.com/services/TU_WEBHOOK_AQUI
      events:
        - success
        - fail
        - fixed
        - on_hold
